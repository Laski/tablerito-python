[project]
name = "tablerito"
version = "0.1.0"
description = "A kanban-style task board: the sample app of the course"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1,<3.2",
    "requests>=2.32",
    "waitress>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
